# Publishes the R* Scores viewer (the app/ folder) to GitHub Pages:
# https://lmerchant.github.io/Rstar_precipitation-relationships/
#
# Runs when main is pushed with changes under app/ (or to this file), or by hand from the Actions tab.
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The app has no build step: app/data/rstar-data.js is committed, so rebuild it with
# `python3 app/scripts/build_data.py` and commit before pushing.

name: Publish app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # lets deploy-pages list this run's artifacts

# One deploy at a time; a newer push replaces a queued one but never cancels one already running.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, like GitHub's starter Pages workflows. With the upload and the deploy in one job, deploy-pages@v5
# sometimes looked for the "github-pages" artifact a moment after upload-pages-artifact@v5 finished, found 0 and
# failed ("No artifacts named github-pages were found", 2026-11-24). A separate deploy job starts only after the
# build job, and its upload, have finished.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Copy the site without the developer files (tests, test settings, the data build script).
      - name: Gather the site files
        run: >
          rsync -a
          --exclude e2e/ --exclude pytest.ini --exclude requirements-dev.txt --exclude scripts/
          app/ _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
